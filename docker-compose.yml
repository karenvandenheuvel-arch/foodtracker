services:
  foodtracker:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in your .env file}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    volumes:
      - foodtracker-data:/app/data

volumes:
  foodtracker-data:
